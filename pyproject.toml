[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-integrity-investigator"
version = "0.1.0"
description = "LLM-assisted investigation workflow for flagged healthcare claims."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["investigator*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
